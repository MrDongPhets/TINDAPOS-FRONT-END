# Tindapo frontend in local Docker — same behaviour as vercel.json (single-page app fallback)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # Never cache the app shell / service worker, so a rebuild shows up on reload
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-store"; }
}
